name: Fuzz

# Daily fuzz run for the cargo-fuzz harness under fuzz/. The rich
# attack surface is the CSS `filter` property value parser (Filter
# Effects 1 §5 / §6.1): a text grammar with function names, exponents,
# percentage / angle / length units, nested rgb() colours inside
# drop-shadow(), and the none / url() special forms — plus the §9.2 /
# §9.3 filter primitive tree evaluator behind it. The clean-room wall
# bars any external implementation as a cross-check oracle, so both
# targets are panic-free harnesses.

on:
  schedule:
    - cron: "53 7 * * *"   # daily 07:53 UTC, jittered off the hour
  workflow_dispatch:

jobs:
  fuzz:
    uses: OxideAV/.github/.github/workflows/crate-fuzz.yml@master
    with:
      time_budget_seconds: 1800
    secrets: inherit
